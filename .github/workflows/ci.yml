name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qrmenu
          POSTGRES_PASSWORD: qrmenu
          POSTGRES_DB: qrmenu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrmenu -d qrmenu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qrmenu:qrmenu@127.0.0.1:5432/qrmenu
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Codespaces configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json', 'utf8'))"
          docker compose -f .devcontainer/compose.yaml config >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Verify migrations
        run: npm run db:migrate

      - name: Verify Codespaces Server Action proxy
        env:
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
          NEXT_PUBLIC_APP_URL: https://test-codespace-3000.app.github.dev
        run: |
          nohup npm run dev -- -H 127.0.0.1 > /tmp/qrmenu-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              cat /tmp/qrmenu-dev.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/admin/setup -o /tmp/setup.html
          ACTION_NAME=$(grep -o 'name="\$ACTION_ID_[^"]*"' /tmp/setup.html | head -n1 | sed 's/^name="//;s/"$//')
          test -n "$ACTION_NAME"

          STATUS=$(curl -sS -o /tmp/action-body -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/admin/setup \
            -H 'Origin: http://localhost:3000' \
            -H 'X-Forwarded-Host: test-codespace-3000.app.github.dev' \
            -F "$ACTION_NAME=" \
            -F 'email=codespace-smoke@example.com' \
            -F 'password=CodespaceSmoke123!' \
            -F 'confirmPassword=CodespaceSmoke123!')

          test "$STATUS" != "500"
          ! grep -q 'Invalid Server Actions request' /tmp/action-body

      - name: Lint, typecheck, unit tests and build
        run: npm run check
