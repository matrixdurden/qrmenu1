name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qrmenu
          POSTGRES_PASSWORD: qrmenu
          POSTGRES_DB: qrmenu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrmenu -d qrmenu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qrmenu:qrmenu@127.0.0.1:5432/qrmenu
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Verify migrations
        run: npm run db:migrate

      - name: Lint, typecheck, unit tests and build
        run: npm run check
