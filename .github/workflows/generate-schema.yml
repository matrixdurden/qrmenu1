name: Generate schema migration

on:
  push:
    branches:
      - feature/complete-platform

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Commit generated migration
        run: |
          if git diff --quiet -- drizzle; then
            echo "No schema migration changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "db: generate platform migration"
          git push origin HEAD:feature/complete-platform
