name: Codespaces smoke test

on:
  push:
    branches:
      - feat/codespaces

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json', 'utf8'))"
          docker compose -f .devcontainer/compose.yaml config >/dev/null

      - name: Start Codespaces services
        run: docker compose -f .devcontainer/compose.yaml up -d

      - name: Run Codespaces setup
        run: docker compose -f .devcontainer/compose.yaml exec -T app bash .devcontainer/setup.sh

      - name: Start app
        run: docker compose -f .devcontainer/compose.yaml exec -T app bash .devcontainer/start.sh

      - name: Verify app inside dev container
        run: |
          docker compose -f .devcontainer/compose.yaml exec -T app curl -fsS http://127.0.0.1:3000/api/health
          docker compose -f .devcontainer/compose.yaml exec -T app curl -fsS http://127.0.0.1:3000/api/ready
          docker compose -f .devcontainer/compose.yaml exec -T app bash -lc "curl -fsS http://127.0.0.1:3000/menu/mira | grep -q 'MIRA'"
          docker compose -f .devcontainer/compose.yaml exec -T app bash -lc "curl -LsS -o /tmp/admin.html -w '%{url_effective}' http://127.0.0.1:3000/admin | grep -Eq '/admin/(setup|login)$'"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f .devcontainer/compose.yaml logs --no-color || true
          docker compose -f .devcontainer/compose.yaml exec -T app tail -n 100 /tmp/qrmenu-dev.log || true

      - name: Stop services
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down -v
