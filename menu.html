<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f2">
    <title>MIRA — QR Menü</title>
    <style>
        :root{
            --bg:#f7f6f2;
            --card:#ffffff;
            --text:#171714;
            --muted:#7a776f;
            --line:#e9e6de;
            --accent:#173c2b;
            --accent-soft:#e9f0ec;
            --danger:#a84538;
            --radius:20px;
            --shadow:0 10px 30px rgba(28,25,18,.07);
        }

        *{box-sizing:border-box}
        html{scroll-behavior:smooth;background:#eceae4}
        body{
            margin:0;
            min-height:100vh;
            color:var(--text);
            background:#eceae4;
            font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            -webkit-font-smoothing:antialiased;
        }
        button,input{font:inherit}
        button{color:inherit}
        img{display:block;width:100%}
        a{text-decoration:none;color:inherit}

        /* QR menü masaüstünde website gibi büyümez */
        .app{
            width:100%;
            max-width:560px;
            min-height:100vh;
            margin:0 auto;
            background:var(--bg);
            box-shadow:0 0 70px rgba(0,0,0,.08);
        }

        .hero{
            position:relative;
            height:190px;
            overflow:hidden;
            background:#d8d4ca;
        }
        .hero img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .hero:after{
            content:"";
            position:absolute;
            inset:0;
            background:linear-gradient(180deg,rgba(0,0,0,.06) 20%,rgba(0,0,0,.62) 100%);
        }
        .hero-actions{
            position:absolute;
            z-index:3;
            top:max(14px,env(safe-area-inset-top));
            left:16px;
            right:16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .round-btn{
            width:38px;
            height:38px;
            border:1px solid rgba(255,255,255,.34);
            border-radius:50%;
            display:grid;
            place-items:center;
            background:rgba(20,20,17,.26);
            color:white;
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            cursor:pointer;
        }
        .lang{
            width:auto;
            padding:0 13px;
            border-radius:999px;
            font-size:11px;
            font-weight:800;
            letter-spacing:.05em;
        }
        .hero-brand{
            position:absolute;
            z-index:3;
            left:18px;
            right:18px;
            bottom:16px;
            color:white;
        }
        .brand-line{
            display:flex;
            justify-content:space-between;
            align-items:flex-end;
            gap:16px;
        }
        .brand-title{
            margin:0;
            font-family:Georgia,"Times New Roman",serif;
            font-size:31px;
            font-weight:500;
            line-height:1;
            letter-spacing:-.035em;
        }
        .brand-sub{
            margin:5px 0 0;
            color:rgba(255,255,255,.76);
            font-size:11px;
        }
        .open-pill{
            flex:0 0 auto;
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding:7px 10px;
            border-radius:999px;
            background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.16);
            font-size:9px;
            font-weight:800;
            backdrop-filter:blur(10px);
        }
        .open-pill i{
            width:6px;
            height:6px;
            border-radius:50%;
            background:#8ee1a9;
        }

        .sticky{
            position:sticky;
            top:0;
            z-index:50;
            background:rgba(247,246,242,.94);
            border-bottom:1px solid rgba(30,28,23,.055);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
        }
        .search-row{
            padding:12px 14px 9px;
        }
        .search{
            height:45px;
            display:flex;
            align-items:center;
            gap:10px;
            padding:0 13px;
            background:#fff;
            border:1px solid var(--line);
            border-radius:15px;
        }
        .search svg{width:18px;color:#858177;flex:0 0 auto}
        .search input{
            min-width:0;
            flex:1;
            border:0;
            outline:0;
            background:transparent;
            color:var(--text);
            font-size:13px;
        }
        .search input::placeholder{color:#a19d94}
        .clear{
            display:none;
            width:27px;
            height:27px;
            padding:0;
            border:0;
            border-radius:50%;
            background:#efede7;
            cursor:pointer;
        }

        .categories{
            display:flex;
            gap:8px;
            padding:0 14px 11px;
            overflow-x:auto;
            scrollbar-width:none;
        }
        .categories::-webkit-scrollbar{display:none}
        .cat{
            flex:0 0 auto;
            height:34px;
            padding:0 13px;
            border:1px solid var(--line);
            border-radius:999px;
            background:#fff;
            color:#656158;
            font-size:11px;
            font-weight:750;
            cursor:pointer;
            white-space:nowrap;
        }
        .cat.active{
            color:white;
            border-color:var(--accent);
            background:var(--accent);
        }

        .content{
            padding:16px 14px 40px;
        }

        .quick-cats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:8px;
            margin-bottom:24px;
        }
        .quick-cat{
            border:0;
            padding:0;
            background:none;
            cursor:pointer;
            text-align:center;
        }
        .quick-img{
            aspect-ratio:1;
            overflow:hidden;
            border-radius:16px;
            background:#e9e6de;
            border:1px solid rgba(0,0,0,.035);
        }
        .quick-img img{
            height:100%;
            object-fit:cover;
        }
        .quick-cat span{
            display:block;
            margin-top:7px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            font-size:10px;
            font-weight:700;
        }

        .section{
            margin-top:26px;
            scroll-margin-top:108px;
        }
        .section:first-of-type{margin-top:0}
        .section-head{
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:12px;
            margin-bottom:12px;
        }
        .section-head h2{
            margin:0;
            font-family:Georgia,"Times New Roman",serif;
            font-size:24px;
            font-weight:500;
            letter-spacing:-.025em;
        }
        .section-head span{
            color:var(--muted);
            font-size:9px;
        }

        .products{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:10px;
        }
        .product{
            min-width:0;
            overflow:hidden;
            background:var(--card);
            border:1px solid var(--line);
            border-radius:18px;
            cursor:pointer;
            transition:transform .15s ease;
        }
        .product:active{transform:scale(.985)}
        .product-media{
            position:relative;
            aspect-ratio:1.05;
            overflow:hidden;
            background:#ebe8e1;
        }
        .product-media img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .badge{
            position:absolute;
            top:8px;
            left:8px;
            padding:5px 7px;
            border-radius:999px;
            background:rgba(255,255,255,.92);
            color:#35322c;
            font-size:7.5px;
            font-weight:850;
            letter-spacing:.03em;
            backdrop-filter:blur(8px);
        }
        .fav{
            position:absolute;
            top:7px;
            right:7px;
            width:29px;
            height:29px;
            border:0;
            border-radius:50%;
            display:grid;
            place-items:center;
            background:rgba(255,255,255,.9);
            cursor:pointer;
        }
        .fav svg{width:14px;height:14px}
        .fav.on svg{fill:var(--danger);stroke:var(--danger)}
        .product-info{
            padding:10px 10px 11px;
        }
        .product-name{
            min-height:32px;
            margin:0;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
            font-family:Georgia,"Times New Roman",serif;
            font-size:15px;
            font-weight:600;
            line-height:1.08;
            letter-spacing:-.012em;
        }
        .product-desc{
            height:30px;
            margin:5px 0 0;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
            color:var(--muted);
            font-size:9.5px;
            line-height:1.45;
        }
        .product-bottom{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:6px;
            margin-top:8px;
        }
        .price{
            color:var(--accent);
            font-size:12px;
            font-weight:850;
        }
        .tiny{
            color:#969189;
            font-size:8px;
        }

        .empty{
            display:none;
            padding:60px 24px;
            text-align:center;
            color:var(--muted);
        }
        .empty strong{
            display:block;
            margin-bottom:6px;
            color:var(--text);
            font-family:Georgia,serif;
            font-size:22px;
            font-weight:500;
        }

        .business-info{
            margin-top:34px;
            padding:16px;
            border-radius:18px;
            background:#efede7;
        }
        .business-info h3{
            margin:0 0 10px;
            font-family:Georgia,serif;
            font-size:18px;
            font-weight:500;
        }
        .info-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            padding:9px 0;
            border-top:1px solid rgba(0,0,0,.055);
            font-size:10px;
        }
        .info-row:first-of-type{border-top:0}
        .info-row span{color:var(--muted)}

        footer{
            padding:4px 14px calc(28px + env(safe-area-inset-bottom));
            text-align:center;
            color:#969189;
            font-size:8px;
        }

        .modal{
            position:fixed;
            inset:0;
            z-index:100;
            display:none;
            align-items:flex-end;
            justify-content:center;
            background:rgba(14,14,12,.46);
            backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);
        }
        .modal.open{display:flex}
        .sheet{
            width:min(560px,100%);
            max-height:90vh;
            overflow-y:auto;
            background:var(--card);
            border-radius:26px 26px 0 0;
            animation:up .2s ease-out both;
        }
        .sheet-handle{
            width:38px;
            height:4px;
            margin:9px auto;
            border-radius:99px;
            background:#d8d4cc;
        }
        .sheet-image{
            position:relative;
            aspect-ratio:1.55;
            overflow:hidden;
            margin:0 12px;
            border-radius:20px;
            background:#ece9e2;
        }
        .sheet-image img{
            height:100%;
            object-fit:cover;
        }
        .close{
            position:absolute;
            top:10px;
            right:10px;
            width:34px;
            height:34px;
            border:0;
            border-radius:50%;
            display:grid;
            place-items:center;
            background:rgba(255,255,255,.94);
            cursor:pointer;
            font-size:18px;
        }
        .sheet-body{
            padding:18px 18px calc(24px + env(safe-area-inset-bottom));
        }
        .sheet-top{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:15px;
        }
        .sheet-cat{
            margin:0 0 5px;
            color:var(--accent);
            font-size:8px;
            font-weight:850;
            letter-spacing:.08em;
            text-transform:uppercase;
        }
        .sheet-title{
            margin:0;
            font-family:Georgia,serif;
            font-size:27px;
            font-weight:500;
            letter-spacing:-.025em;
        }
        .sheet-price{
            flex:0 0 auto;
            color:var(--accent);
            font-size:16px;
            font-weight:850;
        }
        .sheet-desc{
            margin:11px 0 0;
            color:var(--muted);
            font-size:11px;
            line-height:1.6;
        }
        .details{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:8px;
            margin-top:16px;
        }
        .detail{
            padding:12px;
            border-radius:14px;
            background:#f1efe9;
        }
        .detail b{
            display:block;
            margin-bottom:5px;
            color:#8f8a81;
            font-size:7.5px;
            letter-spacing:.08em;
            text-transform:uppercase;
        }
        .detail p{
            margin:0;
            font-size:9.5px;
            line-height:1.5;
        }

        @keyframes up{
            from{opacity:0;transform:translateY(16px)}
            to{opacity:1;transform:translateY(0)}
        }

        @media (min-width:561px){
            body{padding:22px 0}
            .app{
                min-height:calc(100vh - 44px);
                border-radius:28px;
                overflow:hidden;
            }
            .sticky{top:22px}
            .modal{padding-bottom:22px}
            .sheet{border-radius:26px}
        }
    </style>
</head>

<body>
<div class="app">
    <header class="hero">
        <img id="coverImage" alt="İşletme kapak görseli">
        <div class="hero-actions">
            <button class="round-btn lang" type="button">TR</button>
            <button class="round-btn" type="button" aria-label="Bilgi" onclick="document.getElementById('businessInfo').scrollIntoView({behavior:'smooth'})">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 11v5M12 8h.01"></path>
                </svg>
            </button>
        </div>

        <div class="hero-brand">
            <div class="brand-line">
                <div>
                    <h1 class="brand-title" id="brandName"></h1>
                    <p class="brand-sub" id="brandSubtitle"></p>
                </div>
                <div class="open-pill"><i></i><span id="openText"></span></div>
            </div>
        </div>
    </header>

    <div class="sticky">
        <div class="search-row">
            <label class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input id="searchInput" type="search" autocomplete="off" placeholder="Menüde ara">
                <button class="clear" id="clearSearch" type="button" aria-label="Temizle">×</button>
            </label>
        </div>
        <nav class="categories" id="categoryNav"></nav>
    </div>

    <main class="content">
        <div class="quick-cats" id="quickCats"></div>
        <div id="sections"></div>

        <div class="empty" id="empty">
            <strong>Bir şey bulamadık.</strong>
            Aramayı değiştirip tekrar deneyebilirsin.
        </div>

        <section class="business-info" id="businessInfo">
            <h3>İşletme Bilgileri</h3>
            <div class="info-row"><span>Çalışma saatleri</span><b id="hours"></b></div>
            <div class="info-row"><span>Wi‑Fi</span><b id="wifi"></b></div>
            <div class="info-row"><span>Fiyat bilgisi</span><b>Vergiler dahil</b></div>
            <div class="info-row"><span>Alerjen bilgisi</span><b>Ürün detaylarında</b></div>
        </section>
    </main>

    <footer id="footerText"></footer>
</div>

<div class="modal" id="modal" aria-hidden="true">
    <article class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-image">
            <img id="modalImage" alt="">
            <button class="close" id="closeModal" type="button" aria-label="Kapat">×</button>
        </div>
        <div class="sheet-body">
            <div class="sheet-top">
                <div>
                    <p class="sheet-cat" id="modalCategory"></p>
                    <h2 class="sheet-title" id="modalTitle"></h2>
                </div>
                <div class="sheet-price" id="modalPrice"></div>
            </div>
            <p class="sheet-desc" id="modalDesc"></p>
            <div class="details">
                <div class="detail">
                    <b>İçindekiler</b>
                    <p id="modalIngredients"></p>
                </div>
                <div class="detail">
                    <b>Alerjenler</b>
                    <p id="modalAllergens"></p>
                </div>
            </div>
        </div>
    </article>
</div>

const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat("tr-TR").format(n) + " ₺";
const categoryMap = Object.fromEntries(CATEGORIES.map(c => [c.id,c]));

$("#brandName").textContent = BUSINESS.name;
$("#brandSubtitle").textContent = BUSINESS.subtitle;
$("#coverImage").src = BUSINESS.cover;
$("#openText").textContent = BUSINESS.openText;
$("#hours").textContent = BUSINESS.hours;
$("#wifi").textContent = BUSINESS.wifi;
$("#footerText").textContent = BUSINESS.footer;

let query = "";
let activeCategory = "all";

function heart(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>`;
}

function renderNav(){
    $("#categoryNav").innerHTML =
        `<button class="cat ${activeCategory==="all"?"active":""}" data-cat="all">Tümü</button>` +
        CATEGORIES.map(c=>`<button class="cat ${activeCategory===c.id?"active":""}" data-cat="${c.id}">${c.name}</button>`).join("");

    document.querySelectorAll("[data-cat]").forEach(btn=>{
        btn.addEventListener("click",()=>{
            const id=btn.dataset.cat;
            activeCategory=id;
            renderNav();

            if(id==="all"){
                window.scrollTo({top:190,behavior:"smooth"});
            }else{
                const target=document.getElementById("section-"+id);
                if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
            }
        });
    });
}

function renderQuick(){
    $("#quickCats").innerHTML=CATEGORIES.slice(0,4).map(c=>`
        <button class="quick-cat" type="button" data-quick="${c.id}">
            <div class="quick-img"><img src="${c.image}" alt="${c.name}" loading="lazy"></div>
            <span>${c.name}</span>
        </button>
    `).join("");

    document.querySelectorAll("[data-quick]").forEach(btn=>{
        btn.addEventListener("click",()=>{
            activeCategory=btn.dataset.quick;
            renderNav();
            document.getElementById("section-"+activeCategory)?.scrollIntoView({behavior:"smooth",block:"start"});
        });
    });
}

function matches(p){
    if(!query) return true;
    const hay=[p.name,p.desc,p.ingredients,p.allergens,p.note,categoryMap[p.category]?.name]
        .join(" ").toLocaleLowerCase("tr-TR");
    return hay.includes(query);
}

function card(p){
    return `
        <article class="product" data-product="${p.id}">
            <div class="product-media">
                <img src="${p.image}" alt="${p.name}" loading="lazy">
                ${p.badge?`<span class="badge">${p.badge}</span>`:""}
                <button class="fav" type="button" aria-label="Favori">${heart()}</button>
            </div>
            <div class="product-info">
                <h3 class="product-name">${p.name}</h3>
                <p class="product-desc">${p.desc}</p>
                <div class="product-bottom">
                    <span class="price">${money(p.price)}</span>
                    <span class="tiny">${p.note}</span>
                </div>
            </div>
        </article>
    `;
}

function renderSections(){
    const sections=CATEGORIES.map(c=>{
        const list=PRODUCTS.filter(p=>p.category===c.id && matches(p));
        if(!list.length) return "";
        return `
            <section class="section" id="section-${c.id}">
                <div class="section-head">
                    <h2>${c.name}</h2>
                    <span>${list.length} ürün</span>
                </div>
                <div class="products">${list.map(card).join("")}</div>
            </section>
        `;
    }).join("");

    $("#sections").innerHTML=sections;
    $("#empty").style.display=sections ? "none" : "block";

    document.querySelectorAll("[data-product]").forEach(el=>{
        el.addEventListener("click",e=>{
            if(e.target.closest(".fav")) return;
            openProduct(Number(el.dataset.product));
        });
    });

    document.querySelectorAll(".fav").forEach(btn=>{
        btn.addEventListener("click",e=>{
            e.stopPropagation();
            btn.classList.toggle("on");
        });
    });
}

function openProduct(id){
    const p=PRODUCTS.find(x=>x.id===id);
    if(!p) return;
    $("#modalImage").src=p.image;
    $("#modalImage").alt=p.name;
    $("#modalCategory").textContent=categoryMap[p.category]?.name || "";
    $("#modalTitle").textContent=p.name;
    $("#modalPrice").textContent=money(p.price);
    $("#modalDesc").textContent=p.desc;
    $("#modalIngredients").textContent=p.ingredients;
    $("#modalAllergens").textContent=p.allergens;
    $("#modal").classList.add("open");
    $("#modal").setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
}

function closeModal(){
    $("#modal").classList.remove("open");
    $("#modal").setAttribute("aria-hidden","true");
    document.body.style.overflow="";
}

$("#searchInput").addEventListener("input",e=>{
    query=e.target.value.trim().toLocaleLowerCase("tr-TR");
    $("#clearSearch").style.display=query?"block":"none";
    renderSections();
});

$("#clearSearch").addEventListener("click",()=>{
    $("#searchInput").value="";
    query="";
    $("#clearSearch").style.display="none";
    renderSections();
    $("#searchInput").focus();
});

$("#closeModal").addEventListener("click",closeModal);
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

renderNav();
renderQuick();
renderSections();

/* Kaydırırken aktif kategoriyi takip et */
const observer=new IntersectionObserver(entries=>{
    const visible=entries
        .filter(e=>e.isIntersecting)
        .sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];

    if(visible){
        activeCategory=visible.target.id.replace("section-","");
        renderNav();
        const active=document.querySelector(".cat.active");
        active?.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
    }
},{rootMargin:"-115px 0px -55% 0px",threshold:[0,.2,.5]});

document.querySelectorAll(".section").forEach(s=>observer.observe(s));
</script>
